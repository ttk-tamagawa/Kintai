spring:
  application:
    name: kintai

  # デフォルトプロファイル（明示指定がなければdevを使用）
  profiles:
    default: dev

  # JPA共通設定
  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Tokyo

  # Flyway共通設定
  flyway:
    enabled: true
    locations: classpath:db/migration

  # jOOQ共通設定（Read Modelの型安全SQLアクセス用）
  jooq:
    sql-dialect: POSTGRES

# サーバー設定
server:
  port: 8080

# JWT認証設定（secret は各プロファイルまたは環境変数 APP_JWT_SECRET で設定すること）
app:
  jwt:
    expiration-ms: 900000           # アクセストークン有効期限: 15分
    refresh-expiration-ms: 604800000  # リフレッシュトークン有効期限: 7日
  google:
    client-id: ${GOOGLE_CLIENT_ID:not-configured}

spring:
  application:
    name: kintai

  # デフォルトプロファイル（明示指定がなければdevを使用）
  profiles:
    default: dev

  # JPA共通設定
  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Tokyo

  # Flyway共通設定
  flyway:
    enabled: true
    locations: classpath:db/migration

# サーバー設定
server:
  port: 8080

# JWT認証設定（secret は各プロファイルまたは環境変数 APP_JWT_SECRET で設定すること）
app:
  jwt:
    expiration-ms: 86400000  # 24時間
  google:
    client-id: ${GOOGLE_CLIENT_ID:not-configured}
